[workspace]
resolver = "2"
members = ["crates/retopo-core", "crates/retopo-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Guillermode20/OpenRetopo"
authors = ["OpenRetopo contributors"]

[workspace.dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["macros", "std"] }
rayon = "1.12"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
